[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pft-rso-detection"
version = "0.1.0"
description = "Standalone proximity filtering and tracking for moving-object candidates in optical image sequences"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "opencv-python-headless>=4.8,<5"]
keywords = ["space-situational-awareness", "rso", "detection", "tracking", "astronomy"]

[project.scripts]
pft-detect = "pft_rso.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

